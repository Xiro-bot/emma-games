<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Letter Balloons 💖</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
    overflow: hidden; user-select: none;
    background: linear-gradient(180deg, #7ec8f7 0%, #a8dcfb 45%, #ffd9ec 100%);
    display: flex; flex-direction: column;
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(4px);
    z-index: 50; flex-wrap: wrap;
  }
  #hud h1 { font-size: 24px; color: #d42a7d; text-shadow: 0 1px 0 #fff; }
  .spacer { flex: 1; }
  #wordcount { font-size: 18px; color: #6a3a8a; font-weight: bold;
    background: #fff; border-radius: 20px; padding: 5px 14px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .diffbtn, .laybtn {
    font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer;
    border: 3px solid #fff; border-radius: 20px; padding: 5px 13px;
    background: #e9d6ff; color: #6a3a8a; box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .diffbtn.on { background: #ffd24d; color: #7a4a00; transform: scale(1.08); }
  .laybtn { background: #d6ecff; font-size: 13px; }

  /* ---------- SKY ---------- */
  #sky { position: relative; flex: 1; overflow: hidden; }
  .cloud { position: absolute; background: #fff; border-radius: 50px; opacity: .85;
    animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 55%; height: 160%; left: 12%; top: -70%; }
  .cloud::after  { width: 40%; height: 120%; right: 12%; top: -40%; }
  @keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(110vw); } }
  #sun { position: absolute; top: 18px; right: 34px; width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd24d 60%, #ffb63d);
    box-shadow: 0 0 60px 22px rgba(255,210,77,.55); animation: sunspin 24s linear infinite; }
  @keyframes sunspin { to { transform: rotate(360deg); } }
  #rainbow { position: absolute; left: -10%; bottom: 0; width: 120%; height: 100%;
    opacity: .4; pointer-events: none;
    background: radial-gradient(ellipse 62% 88% at 50% 100%,
      transparent 0 55%, #a64dff 55% 58.5%, #4dd2ff 58.5% 62%, #4dff7a 62% 65.5%,
      #ffe24d 65.5% 69%, #ff9a3d 69% 72.5%, #ff4d4d 72.5% 76%, transparent 76%); }

  /* ---------- heart balloon ---------- */
  .balloon { position: absolute; width: 110px; height: 100px; will-change: transform; }
  .heart { position: absolute; inset: 0; transform: rotate(-45deg); }
  .heart .body { position: absolute; left: 18px; top: 18px; width: 64px; height: 64px;
    border-radius: 0 0 0 12px; background: var(--c1); }
  .heart .lobeA, .heart .lobeB { position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: var(--c1); }
  .heart .lobeA { left: 18px; top: -14px; }
  .heart .lobeB { left: 50px; top: 18px; }
  .heart .shine { position: absolute; left: 30px; top: 2px; width: 20px; height: 30px;
    border-radius: 50%; background: rgba(255,255,255,.55); transform: rotate(12deg); }
  .balloon .glyph {
    position: absolute; left: 0; right: 0; top: 26px; text-align: center;
    font-size: 44px; font-weight: bold; color: #fff; z-index: 3;
    text-shadow: 0 2px 3px rgba(0,0,0,.35), 0 0 10px rgba(255,255,255,.4);
  }
  .balloon .string { position: absolute; left: 50%; top: 92px; z-index: 1; }
  .balloon.bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: 8px; } }

  .shard { position: absolute; font-size: 22px; pointer-events: none; z-index: 40;
    animation: shardfly .7s ease-out forwards; }
  @keyframes shardfly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
  .popword { position: absolute; font-size: 34px; font-weight: bold; color: #ff2d78; z-index: 41;
    text-shadow: 0 2px 0 #fff; pointer-events: none; animation: popword .6s ease-out forwards; }
  @keyframes popword { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.6) translateY(-30px); opacity: 0; } }

  .flyletter { position: absolute; font-size: 44px; font-weight: bold; color: #d42a7d; z-index: 60;
    text-shadow: 0 0 12px #fff, 0 2px 2px rgba(0,0,0,.25);
    transition: left .65s cubic-bezier(.3,.7,.4,1), top .65s cubic-bezier(.3,.7,.4,1), font-size .65s; }

  /* ---------- banner / messages ---------- */
  #banner { position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(255,255,255,.92); border: 4px solid #ff9ac9; border-radius: 26px;
    padding: 10px 26px; font-size: 22px; font-weight: bold; color: #d42a7d; z-index: 45;
    text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.12); max-width: 92%;
    animation: bannerpop .4s ease; }
  @keyframes bannerpop { from { transform: translateX(-50%) scale(.6); } }
  #banner .sub { font-size: 15px; color: #6a3a8a; font-weight: normal; margin-top: 2px; }

  /* ---------- word tray ---------- */
  #tray { display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 10px 12px 6px; z-index: 30; }
  #pic { font-size: 64px; line-height: 1; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25));
    animation: picbob 2.2s ease-in-out infinite; }
  @keyframes picbob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
  #tiles { display: flex; gap: 10px; }
  .tile { width: 66px; height: 66px; border-radius: 18px; position: relative;
    background: linear-gradient(160deg, #fff, #ffe3f1); border: 4px dashed #ff9ac9;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: bold; color: #d42a7d; }
  .tile .ghost { opacity: .28; }
  .tile.filled { border-style: solid; border-color: #ff4dd2;
    background: linear-gradient(160deg, #ffe3f1, #ffc2e2);
    box-shadow: 0 0 16px rgba(255,77,210,.55); animation: tilepop .35s ease; }
  .tile.filled::after { content: "💖"; position: absolute; right: -6px; top: -10px; font-size: 18px; }
  @keyframes tilepop { 0% { transform: scale(.5); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .tile.wrongshake { animation: wrongshake .35s ease; }
  @keyframes wrongshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  /* ---------- on-screen keyboard ---------- */
  #keyboard { padding: 6px 10px 16px; z-index: 30; display: flex; flex-direction: column;
    align-items: center; gap: 7px; transition: opacity .4s; }
  .krow { display: flex; gap: 7px; }
  .key { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; font-size: 24px; font-weight: bold; color: #4a3a6a;
    background: linear-gradient(180deg, #ffffff, #e6e0f5); border: 3px solid #cbbcf0;
    box-shadow: 0 4px 0 #b3a3dd; }
  .key.hint { background: linear-gradient(180deg, #fff2b0, #ffd24d); border-color: #ffb63d;
    box-shadow: 0 4px 0 #e09a20, 0 0 18px 4px rgba(255,210,77,.8);
    color: #7a4a00; animation: keypulse .8s ease-in-out infinite; }
  @keyframes keypulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  .key.pressgood { background: linear-gradient(180deg, #c9ffd8, #5fe08a); border-color: #34b45e; }
  .key.pressbad { background: linear-gradient(180deg, #ffd6d6, #ff9a9a); border-color: #e06a6a; }

  /* ---------- confetti / celebration ---------- */
  .confetti { position: fixed; top: -50px; font-size: 30px; z-index: 90; pointer-events: none;
    animation: confall linear forwards; }
  @keyframes confall { to { transform: translateY(115vh) rotate(720deg); } }

  #finale { position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: rgba(60,20,80,.55); backdrop-filter: blur(3px); text-align: center; }
  #finale .box { background: linear-gradient(160deg, #fff, #ffe9f6); border-radius: 34px;
    border: 6px solid #ffd24d; padding: 36px 46px; box-shadow: 0 16px 40px rgba(0,0,0,.4);
    animation: bannerpop2 .5s ease; }
  @keyframes bannerpop2 { from { transform: scale(.5); } }
  #finale .trophy { font-size: 90px; animation: picbob 1.8s ease-in-out infinite; display: block; }
  #finale h2 { font-size: 36px; color: #d42a7d; margin: 10px 0 4px; }
  #finale p { font-size: 20px; color: #6a3a8a; }
  #finale button { margin-top: 18px; font-family: inherit; font-size: 24px; font-weight: bold;
    background: linear-gradient(180deg, #ffd24d, #ffb63d); color: #7a4a00;
    border: 4px solid #fff; border-radius: 26px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 6px 0 #c98a1e; }
  #finale button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c98a1e; }
</style>
</head>
<body>

<div id="hud">
  <h1>💖 Letter Balloons</h1>
  <span id="wordcount">Word 1 / 5</span>
  <div class="spacer"></div>
  <button class="diffbtn on" data-d="easy">🐢 Easy</button>
  <button class="diffbtn" data-d="med">🦋 Medium</button>
  <button class="diffbtn" data-d="star">🌟 Star Typist</button>
  <button class="laybtn" id="laybtn" title="Match Emma's real keyboard">⌨️ QWERTZ</button>
</div>

<div id="sky">
  <div id="sun"></div>
  <div id="rainbow"></div>
  <div id="banner">Pop the balloon with the golden letter! <div class="sub" id="bannersub"></div></div>
</div>

<div id="tray">
  <span id="pic">👧</span>
  <div id="tiles"></div>
</div>

<div id="keyboard"></div>

<div id="finale">
  <div class="box">
    <span class="trophy">🏆</span>
    <h2>BRAVO EMMA!</h2>
    <p>You typed all the words!<br>You are a typing star! 🌟⌨️🌟</p>
    <button id="again">▶ Play again!</button>
  </div>
</div>

<script>
"use strict";
/* ================= config ================= */
const WORDS = [
  { w: "EMMA", pic: "👧" },
  { w: "CAT",  pic: "🐱" },
  { w: "SUN",  pic: "☀️" },
  { w: "DOG",  pic: "🐶" },
  { w: "BEE",  pic: "🐝" },
  { w: "PIG",  pic: "🐷" },
  { w: "STAR", pic: "⭐" },
  { w: "CAKE", pic: "🎂" },
  { w: "FISH", pic: "🐟" },
  { w: "LOVE", pic: "💖" },
];
const SESSION_LEN = 5;

const DIFF = {
  easy: { decoys: 0, speed: 30, hint: "always", ghost: true,  spawnGap: 900 },
  med:  { decoys: 2, speed: 40, hint: "delay",  ghost: true,  spawnGap: 750 },
  star: { decoys: 4, speed: 55, hint: "never",  ghost: false, spawnGap: 600 },
};
let diff = DIFF.easy;

const LAYOUTS = {
  QWERTZ: ["QWERTZUIOP", "ASDFGHJKL", "YXCVBNM"],
  QWERTY: ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"],
};
let layoutName = "QWERTZ";
try { layoutName = localStorage.getItem("emmaKbLayout") || "QWERTZ"; } catch (e) {}
if (!LAYOUTS[layoutName]) layoutName = "QWERTZ";

const COLORS = [
  ["#ff5f9e", "#ff2d78"], ["#ff8f5f", "#ff5f2d"], ["#ffd24d", "#ffb02d"],
  ["#6fe08a", "#2db45e"], ["#5fc8ff", "#2d9ae0"], ["#b48aff", "#8a4dff"],
  ["#ff8ad2", "#e05fb0"],
];

/* ================= state ================= */
const sky = document.getElementById("sky");
const tilesEl = document.getElementById("tiles");
const picEl = document.getElementById("pic");
const banner = document.getElementById("banner");
const bannersub = document.getElementById("bannersub");
const wordcount = document.getElementById("wordcount");
const kbEl = document.getElementById("keyboard");
const finale = document.getElementById("finale");

let sessionWords = [];   // list of {w,pic} for this session
let wordIdx = 0;         // which word in the session
let word = "";           // current word
let li = 0;              // next letter index within word
let phase = "pop";       // pop | type | between | done
let balloons = [];       // live balloon objects
let lastSpawn = 0;       // timestamp of last spawn
let lastProgress = 0;    // for delayed hint on Medium

/* ================= audio ================= */
let AC = null;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(freq, dur, type, vol, when) {
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .25, a.currentTime + (when || 0));
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + (when || 0) + dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime + (when || 0)); o.stop(a.currentTime + (when || 0) + dur + .05);
}
function popSound() {
  const a = ac(), b = a.createBuffer(1, a.sampleRate * .12, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const s = a.createBufferSource(), g = a.createGain();
  g.gain.value = .5; s.buffer = b; s.connect(g); g.connect(a.destination); s.start();
  tone(600, .1, "square", .12);
}
function dingSound() { tone(880, .3, "sine", .3); tone(1320, .4, "sine", .2, .08); }
function boopSound() { tone(180, .18, "sine", .18); }
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, "triangle", .3, i * .14)); }

function speak(text, opts) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = (opts && opts.rate) || .85; u.pitch = 1.25; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================= keyboard UI ================= */
function buildKeyboard() {
  kbEl.innerHTML = "";
  LAYOUTS[layoutName].forEach(row => {
    const r = document.createElement("div"); r.className = "krow";
    for (const ch of row) {
      const k = document.createElement("div");
      k.className = "key"; k.dataset.k = ch; k.textContent = ch;
      r.appendChild(k);
    }
    kbEl.appendChild(r);
  });
}
function keyEl(ch) { return kbEl.querySelector('.key[data-k="' + ch + '"]'); }
function clearHints() { kbEl.querySelectorAll(".key.hint").forEach(k => k.classList.remove("hint")); }
function showHint() {
  let target = null;
  if ((phase === "pop" || phase === "type") && li < word.length &&
      diff.hint !== "never" &&
      !(diff.hint === "delay" && Date.now() - lastProgress < 3000)) {
    target = word[li];
  }
  kbEl.querySelectorAll(".key.hint").forEach(k => { if (k.dataset.k !== target) k.classList.remove("hint"); });
  if (target) {
    const k = keyEl(target);
    if (k && !k.classList.contains("hint")) k.classList.add("hint");
  }
}
function flashKey(ch, good) {
  const k = keyEl(ch); if (!k) return;
  const cls = good ? "pressgood" : "pressbad";
  k.classList.add(cls); setTimeout(() => k.classList.remove(cls), 220);
}
document.getElementById("laybtn").addEventListener("click", () => {
  layoutName = layoutName === "QWERTZ" ? "QWERTY" : "QWERTZ";
  try { localStorage.setItem("emmaKbLayout", layoutName); } catch (e) {}
  document.getElementById("laybtn").textContent = "⌨️ " + layoutName;
  buildKeyboard(); showHint();
});
document.getElementById("laybtn").textContent = "⌨️ " + layoutName;

/* ================= tiles ================= */
function buildTiles() {
  tilesEl.innerHTML = "";
  for (const ch of word) {
    const t = document.createElement("div"); t.className = "tile";
    t.innerHTML = '<span class="ghost">' + (diff.ghost ? ch : "") + "</span>";
    tilesEl.appendChild(t);
  }
}
function fillTile(i, animateFromBalloon) {
  const t = tilesEl.children[i]; if (!t) return;
  t.classList.add("filled"); t.innerHTML = word[i];
}
function shakeTiles() {
  const t = tilesEl.children[li]; if (!t) return;
  t.classList.add("wrongshake"); setTimeout(() => t.classList.remove("wrongshake"), 380);
}

/* ================= balloons ================= */
function makeBalloon(letter) {
  const el = document.createElement("div");
  el.className = "balloon";
  const [c1] = [COLORS[Math.floor(Math.random() * COLORS.length)]];
  el.style.setProperty("--c1", "radial-gradient(circle at 35% 30%, " + c1[0] + ", " + c1[1] + ")");
  el.innerHTML =
    '<div class="heart">' +
      '<div class="lobeA" style="background:var(--c1)"></div>' +
      '<div class="lobeB" style="background:var(--c1)"></div>' +
      '<div class="body" style="background:var(--c1)"></div>' +
      '<div class="shine"></div>' +
    "</div>" +
    '<div class="glyph">' + letter + "</div>" +
    '<svg class="string" width="20" height="70" viewBox="0 0 20 70">' +
      '<path d="M10 0 Q 20 18 8 34 Q -2 50 12 70" stroke="#c96" stroke-width="2" fill="none"/></svg>';
  const skyW = sky.clientWidth;
  const b = {
    el, letter,
    x: 60 + Math.random() * Math.max(100, skyW - 240),
    y: sky.clientHeight + 60,
    sway: 14 + Math.random() * 16,
    swaySpeed: .8 + Math.random() * .8,
    phase0: Math.random() * Math.PI * 2,
    speed: diff.speed * (.85 + Math.random() * .3),
  };
  el.style.left = "0px"; el.style.top = "0px";
  sky.appendChild(el);
  balloons.push(b);
  return b;
}

function removeBalloon(b) {
  b.el.remove();
  balloons = balloons.filter(x => x !== b);
}

function burstBalloon(b, isTarget) {
  popSound();
  const cx = b.x + 55, cy = b.y + 50;
  for (let i = 0; i < 8; i++) {
    const s = document.createElement("div"); s.className = "shard";
    s.textContent = ["💖", "💗", "✨", "💕"][i % 4];
    s.style.left = cx + "px"; s.style.top = cy + "px";
    s.style.setProperty("--dx", (Math.cos(i / 8 * Math.PI * 2) * (60 + Math.random() * 50)) + "px");
    s.style.setProperty("--dy", (Math.sin(i / 8 * Math.PI * 2) * (60 + Math.random() * 50)) + "px");
    s.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
    sky.appendChild(s); setTimeout(() => s.remove(), 750);
  }
  const p = document.createElement("div"); p.className = "popword"; p.textContent = "POP!";
  p.style.left = (cx - 30) + "px"; p.style.top = (cy - 20) + "px";
  sky.appendChild(p); setTimeout(() => p.remove(), 650);

  if (isTarget) {
    // letter flies down into its tile
    const fl = document.createElement("div"); fl.className = "flyletter"; fl.textContent = b.letter;
    fl.style.left = cx + "px"; fl.style.top = cy + "px";
    document.body.appendChild(fl);
    const tile = tilesEl.children[li];
    const r = tile.getBoundingClientRect();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fl.style.left = (r.left + r.width / 2 - 14) + "px";
      fl.style.top = (r.top + 6) + "px"; fl.style.fontSize = "40px";
    }));
    const myIndex = li;
    setTimeout(() => { fl.remove(); fillTile(myIndex); dingSound(); }, 680);
  }
  removeBalloon(b);
}

/* ================= game flow ================= */
function pickSession() {
  const others = WORDS.slice(1).sort(() => Math.random() - .5).slice(0, SESSION_LEN - 1);
  sessionWords = [WORDS[0], ...others];
}

function startWord() {
  const entry = sessionWords[wordIdx];
  word = entry.w; li = 0; phase = "pop"; lastProgress = Date.now();
  picEl.textContent = entry.pic;
  wordcount.textContent = "Word " + (wordIdx + 1) + " / " + SESSION_LEN;
  buildTiles();
  clearSkyBalloons();
  banner.firstChild.textContent = "Pop the balloons to build the word! ";
  bannersub.textContent = "Press the letter on the balloon 🎈";
  banner.style.display = "block";
  speak("Pop the balloons!");
}

function clearSkyBalloons() { balloons.forEach(b => b.el.remove()); balloons = []; }

function startTypePhase() {
  phase = "type"; li = 0; lastProgress = Date.now();
  clearSkyBalloons();
  buildTiles();
  banner.firstChild.textContent = "Your turn! Type " + word + " all by yourself! ";
  bannersub.textContent = "One letter at a time — you can do it! 💪";
  dingSound();
  speak("Your turn! Type the word " + word.toLowerCase() + " all by yourself!");
  showHint();
}

function wordDone() {
  phase = "between";
  clearHints();
  fanfare(); confettiRain(40);
  banner.firstChild.textContent = "🎉 " + word + "! 🎉 ";
  bannersub.textContent = "BRAVO EMMA!";
  // spell it, say it, cheer
  const letters = word.split("").join(", ");
  speak(letters + "!", { rate: .75 });
  setTimeout(() => speak(word.toLowerCase() + "! Bravo Emma! Bravo!", { rate: .85 }), word.length * 900);
  setTimeout(() => {
    wordIdx++;
    if (wordIdx >= SESSION_LEN) grandFinale();
    else startWord();
  }, word.length * 900 + 3200);
}

function grandFinale() {
  phase = "done";
  clearSkyBalloons(); clearHints();
  finale.style.display = "flex";
  confettiRain(90); fanfare();
  setTimeout(fanfare, 700);
  speak("Congratulations Emma! You typed all the words! You are a typing star!");
}
document.getElementById("again").addEventListener("click", () => {
  finale.style.display = "none";
  wordIdx = 0; pickSession(); startWord();
});

function confettiRain(n) {
  const glyphs = ["💖", "🎈", "⭐", "🌈", "✨", "💗", "🎉"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = (20 + Math.random() * 26) + "px";
    c.style.animationDuration = (2.2 + Math.random() * 2.5) + "s";
    c.style.animationDelay = (Math.random() * .8) + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 6000);
  }
}

/* ================= input ================= */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const ch = (e.key || "").toUpperCase();
  if (ch.length !== 1 || ch < "A" || ch > "Z") return;
  e.preventDefault();
  try { ac().resume(); } catch (err) {}

  if (phase === "pop") {
    const target = word[li];
    if (ch === target) {
      const b = balloons.find(x => x.letter === target);
      if (b) {
        flashKey(ch, true); lastProgress = Date.now();
        burstBalloon(b, true); li++;
        if (li >= word.length) setTimeout(startTypePhase, 1500);
        else showHint();
      } else { flashKey(ch, true); } // balloon not up yet — no penalty
    } else {
      const decoy = balloons.find(x => x.letter === ch);
      if (decoy) { flashKey(ch, true); burstBalloon(decoy, false); } // fun fizzle, no reward
      else { flashKey(ch, false); boopSound(); }
    }
  } else if (phase === "type") {
    if (ch === word[li]) {
      flashKey(ch, true); lastProgress = Date.now();
      fillTile(li); dingSound(); li++;
      if (li >= word.length) { clearHints(); wordDone(); }
      else showHint();
    } else {
      flashKey(ch, false); boopSound(); shakeTiles(); showHint();
    }
  }
});

/* difficulty buttons */
document.querySelectorAll(".diffbtn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".diffbtn").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  diff = DIFF[b.dataset.d];
  finale.style.display = "none";
  wordIdx = 0; pickSession(); startWord();
}));

/* ================= main loop ================= */
const DECOY_POOL = "ABCDEFGHIJKLMNOPRSTUVW";
let lastT = performance.now();
function tick(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;

  if (phase === "pop") {
    const target = li < word.length ? word[li] : null;
    const now = Date.now();
    if (target) {
      // keep a balloon with the needed letter alive
      const haveTarget = balloons.some(b => b.letter === target);
      if (!haveTarget && now - lastSpawn > diff.spawnGap) { makeBalloon(target); lastSpawn = now; }
      // decoys
      const decoyCount = balloons.filter(b => b.letter !== target).length;
      if (decoyCount < diff.decoys && now - lastSpawn > diff.spawnGap) {
        let ch;
        do { ch = DECOY_POOL[Math.floor(Math.random() * DECOY_POOL.length)]; }
        while (ch === target || balloons.some(b => b.letter === ch));
        makeBalloon(ch); lastSpawn = now;
      }
    }
    // move
    for (const b of [...balloons]) {
      b.y -= b.speed * dt;
      const sway = Math.sin(t / 1000 * b.swaySpeed + b.phase0) * b.sway;
      b.el.style.transform = "translate(" + (b.x + sway) + "px," + b.y + "px)";
      if (b.y < -160) removeBalloon(b); // floated away — a new one will come
    }
    showHint();
  } else if (phase === "type") {
    showHint(); // so the delayed hint (Medium) appears after 3s stuck
  }
  requestAnimationFrame(tick);
}

/* ================= scenery ================= */
for (let i = 0; i < 5; i++) {
  const c = document.createElement("div"); c.className = "cloud";
  const w = 90 + Math.random() * 120;
  c.style.width = w + "px"; c.style.height = w * .32 + "px";
  c.style.top = (5 + Math.random() * 40) + "%";
  c.style.animationDuration = (40 + Math.random() * 50) + "s";
  c.style.animationDelay = (-Math.random() * 60) + "s";
  sky.appendChild(c);
}

/* ================= go ================= */
buildKeyboard();
pickSession();
startWord();
requestAnimationFrame(tick);
</script>
</body>
