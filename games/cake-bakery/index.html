<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Emma's Cake Bakery</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; }
  body {
    font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive;
    background:linear-gradient(#ffeaf4, #ffd9ea 45%, #f7c9dd);
    overflow:hidden; display:flex; flex-direction:column;
    cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><text y="32" font-size="30">🧤</text></svg>') 8 8, auto;
  }
  h1 { text-align:center; padding:4px 0 0; font-size:25px; color:#a8286a;
       text-shadow:2px 2px 0 #ffeaf4, 3px 3px 0 #e79ac0; }
  #sub { text-align:center; font-size:14px; color:#b4568c; padding-bottom:2px; }

  /* ---------- difficulty ---------- */
  #diffbar { position:fixed; top:8px; right:10px; z-index:60; display:flex; gap:5px; }
  .diff { font-family:inherit; font-size:13px; padding:4px 8px; border-radius:12px; border:3px solid #a8286a;
          background:#fff4fa; color:#a8286a; cursor:pointer; }
  .diff.on { background:#ffb0d4; transform:scale(1.08); }
  #backBtn { position:fixed; top:8px; left:10px; z-index:60; font-family:inherit; font-size:13px;
             padding:4px 10px; border-radius:12px; border:3px solid #a8286a; background:#fff4fa;
             color:#a8286a; cursor:pointer; display:none; }

  /* ================= CAKE PICKER ================= */
  #picker { position:fixed; inset:0; z-index:900; background:linear-gradient(#ffeaf4,#f7c9dd);
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  #picker h2 { font-size:30px; color:#a8286a; text-shadow:2px 2px 0 #fff; }
  #pickRow { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:1000px; }
  .pick { width:210px; background:#fff; border:6px solid #ffb0d4; border-radius:26px; padding:14px 10px 12px;
          display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
          box-shadow:0 8px 18px rgba(168,40,106,.22); transition:transform .18s; }
  .pick:hover { transform:translateY(-8px) scale(1.05); border-color:#ff6fae; }
  .pick .nm { font-size:19px; color:#a8286a; text-align:center; line-height:1.15; }
  .pick .dsc { font-size:12px; color:#8a6a7a; text-align:center; min-height:30px; }
  .pickArt { width:150px; height:120px; position:relative; }

  /* ================= SCENE ================= */
  #wrap { flex:1; display:flex; min-height:0; }
  #recipe { width:186px; flex:none; background:#fffdf5; border-right:5px solid #e2b06f;
            padding:6px 8px; overflow:hidden; display:none; flex-direction:column; }
  #recipe h3 { font-size:15px; color:#8a4a12; text-align:center; border-bottom:2px dashed #e2b06f; padding-bottom:3px; margin-bottom:4px; }
  .ing { display:flex; align-items:center; gap:6px; font-size:12px; color:#6b4a2a; padding:1px 0; }
  .ing .ith { width:30px; height:30px; position:relative; flex:none; }
  .ing.got { color:#2f6b28; }
  .ing.got .iqty::after { content:" ✓"; }
  .iqty { font-weight:bold; }
  #steps { margin-top:5px; border-top:2px dashed #e2b06f; padding-top:4px; overflow:hidden; }
  .stp { font-size:11.5px; color:#9a8676; padding:2px 3px; border-radius:7px; line-height:1.2; display:flex; gap:4px; }
  .stp.on { background:#ffd166; color:#6b3d0e; font-weight:bold; transform:scale(1.03); }
  .stp.done { color:#2f6b28; }
  .stp.done .sn::after { content:"✓"; }
  .sn { flex:none; width:14px; }

  #scene { flex:1; position:relative; overflow:hidden; }
  #stageIn { position:absolute; left:50%; bottom:6px; transform-origin:50% 100%;
             display:flex; align-items:flex-end; gap:16px; }

  .station { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative; }
  .bench { width:100%; height:22px; border-radius:10px 10px 0 0; background:linear-gradient(#d79a5c,#b3743a);
           box-shadow:0 -3px 0 #eec092 inset; }

  /* ----- prep station ----- */
  #prepSt { width:342px; }
  #shelf { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; width:342px; margin-bottom:8px; min-height:92px; align-content:flex-end; }
  .card { width:74px; height:88px; background:#fff; border:4px solid #ffb0d4; border-radius:15px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
          box-shadow:0 4px 8px rgba(168,40,106,.18); touch-action:none; position:relative; }
  .card.live { border-color:#ff3d8f; box-shadow:0 0 0 4px rgba(255,61,143,.28), 0 4px 8px rgba(168,40,106,.2);
               animation:cbob 1.1s ease-in-out infinite alternate; }
  @keyframes cbob { from{transform:translateY(0)} to{transform:translateY(-5px)} }
  .card.dim { opacity:.3; }
  .card.used { opacity:.22; }
  .card .thumb { width:50px; height:50px; position:relative; }
  .card .lbl { font-size:10.5px; color:#7c4a1d; text-align:center; line-height:1.05; }
  .card .qty { font-size:10px; color:#a8286a; font-weight:bold; }
  .card * { pointer-events:none; }
  @keyframes nope { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .card.nope { animation:nope .34s; }

  #bowlSpot { width:250px; height:176px; position:relative; }
  #bowl { position:absolute; left:20px; bottom:0; width:210px; height:156px; touch-action:none; }
  #bowlBody { position:absolute; left:0; right:0; top:32px; bottom:0;
              border-radius:18px 18px 105px 105px / 14px 14px 118px 118px;
              background:linear-gradient(150deg,#ffe2ef,#f7a8cc 58%,#e07aa8);
              box-shadow:0 8px 14px rgba(120,40,80,.3), 0 -3px 0 rgba(255,255,255,.45) inset; }
  #bowlMouth { position:absolute; left:4px; right:4px; top:10px; height:54px; border-radius:50%;
               background:#c96a99; box-shadow:0 0 0 6px #f296c1, 0 4px 8px rgba(0,0,0,.32) inset; overflow:hidden; }
  #bowlContent { position:absolute; left:7%; right:7%; top:20%; bottom:8%; border-radius:50%;
                 background:radial-gradient(circle at 45% 38%, #fffaf0, #f3e6cf); display:none; overflow:hidden; }
  #bowlBits { position:absolute; inset:0; }
  #swirl { position:absolute; inset:0; display:none; }
  .streak { position:absolute; left:50%; top:50%; width:36%; height:5px; border-radius:4px;
            background:rgba(255,255,255,.5); transform-origin:0 50%; }
  #stirbar { position:absolute; left:14px; right:14px; top:-14px; height:14px; border-radius:8px;
             border:3px solid #a8286a; background:#fff4fa; overflow:hidden; display:none; z-index:6; }
  #stirfill { height:100%; width:0; background:linear-gradient(90deg,#ffd166,#ff6fae); transition:width .08s; }
  #whisk { position:fixed; z-index:700; display:none; pointer-events:none; transform:translate(-50%,-84%) rotate(18deg); }
  #mixer { position:absolute; left:50%; top:-96px; transform:translateX(-50%); width:96px; height:132px;
           display:none; z-index:8; touch-action:none; }

  /* ----- range (hob + oven) ----- */
  #rangeSt { width:322px; }
  #range { width:314px; position:relative; }
  #hob { height:96px; position:relative; border-radius:14px 14px 0 0;
         background:linear-gradient(#9c9ca6,#63636c); box-shadow:0 -3px 0 rgba(255,255,255,.25) inset; }
  #burner { position:absolute; left:104px; top:46px; transform:translate(-50%,-50%); width:120px; height:82px;
            border-radius:50%; background:radial-gradient(#2c2c31 55%, #4a4a52 56% 70%, #2c2c31 71%);
            box-shadow:0 2px 6px rgba(0,0,0,.5) inset; }
  .sflame { position:absolute; width:14px; height:23px; border-radius:50% 50% 42% 42%/68% 68% 32% 32%;
            background:radial-gradient(closest-side at 50% 88%, #fff3a0,#ffce4d 40%,#ff9a2e 70%,transparent);
            transform-origin:50% 100%; animation:flick .4s ease-in-out infinite alternate; display:none; }
  @keyframes flick { from{transform:scaleY(.8)} to{transform:scaleY(1.2)} }
  #range.hot .sflame { display:block; }
  #knob { position:absolute; right:22px; top:30px; width:44px; height:44px; border-radius:50%;
          background:radial-gradient(circle at 35% 30%,#e8e8ee,#8a8a92 70%); box-shadow:0 3px 6px rgba(0,0,0,.4);
          cursor:pointer; transition:transform .3s; }
  #knob::after { content:""; position:absolute; left:50%; top:4px; width:6px; height:17px; border-radius:4px;
                 background:#3a3a40; transform:translateX(-50%); }
  #range.hot #knob { transform:rotate(120deg); }
  #knobLight { position:absolute; right:38px; top:16px; width:11px; height:11px; border-radius:50%; background:#4a2020; }
  #range.hot #knobLight { background:#ff4d3a; box-shadow:0 0 9px #ff4d3a; }

  #pan { position:absolute; left:44px; top:6px; width:150px; height:96px; touch-action:none; z-index:5; }
  #panBody { position:absolute; left:0; top:22px; width:120px; height:62px; border-radius:8px 8px 34px 34px/6px 6px 40px 40px;
             background:linear-gradient(#7d7d88,#4c4c56); box-shadow:0 5px 10px rgba(0,0,0,.4); }
  #panMouth { position:absolute; left:2px; top:14px; width:116px; height:26px; border-radius:50%;
              background:#3a3a44; box-shadow:0 0 0 4px #8a8a94; overflow:hidden; }
  #panContent { position:absolute; left:6%; right:6%; top:14%; bottom:8%; border-radius:50%;
                background:#e9d9b8; display:none; }
  #panHandle { position:absolute; left:112px; top:24px; width:44px; height:12px; border-radius:6px;
               background:linear-gradient(#3a3a42,#1e1e24); transform:rotate(-12deg); }
  .steam { position:absolute; width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.55);
           animation:rise 2.2s ease-out infinite; pointer-events:none; }
  @keyframes rise { 0%{transform:translateY(0) scale(.5); opacity:0} 25%{opacity:.75}
                    100%{transform:translateY(-58px) scale(1.9); opacity:0} }

  #oven { height:196px; position:relative; border-radius:0 0 14px 14px;
          background:linear-gradient(#8a8a94,#55555e); box-shadow:0 8px 16px rgba(60,30,0,.3); }
  #display { position:absolute; left:14px; top:8px; width:120px; height:26px; border-radius:6px; background:#1a2a1a;
             color:#7dff9a; font-size:13px; display:flex; align-items:center; justify-content:center; letter-spacing:1px;
             font-family:"Courier New",monospace; box-shadow:0 0 8px rgba(125,255,154,.35) inset; }
  #ovenDoor { position:absolute; left:12px; right:12px; top:42px; bottom:14px; border-radius:10px;
              background:linear-gradient(#767680,#4a4a54); border:4px solid #a0a0aa; overflow:hidden;
              transition:transform .45s; transform-origin:50% 100%; }
  #ovenDoor.open { transform:rotateX(72deg); }
  #ovenWin { position:absolute; left:10px; right:10px; top:10px; bottom:26px; border-radius:8px;
             background:radial-gradient(circle at 50% 60%, #241a10, #120c06); overflow:hidden;
             box-shadow:0 0 0 3px #33333c inset; }
  #ovenGlow { position:absolute; inset:0; background:radial-gradient(circle at 50% 70%, rgba(255,150,40,.85), rgba(180,60,0,.15) 70%);
              opacity:0; transition:opacity .5s; }
  #ovenHandle { position:absolute; left:14px; right:14px; bottom:6px; height:11px; border-radius:6px;
                background:linear-gradient(#dcdce4,#9a9aa4); }
  #ovenSlot { position:absolute; left:16%; right:16%; top:58%; height:34px; }
  #ovenTin { position:absolute; left:50%; top:56%; transform:translate(-50%,-50%) scale(.62); display:none; }
  #sign { position:absolute; left:50%; top:-30px; transform:translateX(-50%); white-space:nowrap; z-index:20;
          font-size:17px; color:#fff; background:#a33b12; border-radius:14px; padding:4px 13px;
          border:3px solid #ffeaf4; display:none; }
  #sign.alarm { background:#1f9d3c; font-size:20px; animation:alarmp .45s ease-in-out infinite alternate; }
  @keyframes alarmp { from{transform:translateX(-50%) scale(1)} to{transform:translateX(-50%) scale(1.14)} }
  #barwrap { margin-top:9px; width:290px; position:relative; display:none; }
  #cookbar { width:100%; height:24px; border-radius:12px; border:4px solid #7c4a1d; overflow:hidden;
             position:relative; background:#f7e1b5; }
  #needle { position:absolute; top:-5px; bottom:-5px; width:6px; background:#fff; border:2px solid #a33b12;
            border-radius:4px; left:0; }
  #barstar { position:absolute; top:50%; transform:translate(-50%,-54%); font-size:18px; text-shadow:0 0 6px #fff; pointer-events:none; }

  /* ----- fridge ----- */
  #fridgeSt { width:112px; }
  #fridge { width:104px; height:238px; position:relative; border-radius:12px;
            background:linear-gradient(#eef1f5,#c9d2dc); box-shadow:0 8px 16px rgba(60,60,90,.3), 0 -3px 0 #fff inset;
            border:4px solid #b3bfcc; }
  #fridge::after { content:""; position:absolute; left:6px; right:6px; top:66px; height:4px; background:#b3bfcc; }
  #frHandle { position:absolute; right:9px; top:82px; width:9px; height:64px; border-radius:5px;
              background:linear-gradient(#98a4b2,#7b8794); }
  #frHandle2 { position:absolute; right:9px; top:22px; width:9px; height:34px; border-radius:5px;
               background:linear-gradient(#98a4b2,#7b8794); }
  #frGlow { position:absolute; left:6px; right:6px; top:74px; bottom:6px; border-radius:8px;
            background:radial-gradient(circle at 50% 30%, rgba(170,230,255,.85), rgba(120,190,235,.25));
            opacity:0; transition:opacity .4s; }
  .snowf { position:absolute; font-size:15px; opacity:.9; animation:snow 3s linear infinite; pointer-events:none; }
  @keyframes snow { 0%{transform:translateY(-12px); opacity:0} 20%{opacity:1} 100%{transform:translateY(120px); opacity:0} }
  #chillbar { width:104px; height:15px; border-radius:8px; border:3px solid #5c7a96; background:#eaf4fb;
              overflow:hidden; margin-top:6px; display:none; }
  #chillfill { height:100%; width:0; background:linear-gradient(90deg,#9fd8f5,#4aa8dd); }

  /* ----- tins + cake stand ----- */
  #standSt { width:326px; }
  #tinArea { position:absolute; left:0; right:0; bottom:0; display:flex; gap:8px;
             justify-content:center; align-items:flex-end; flex-wrap:wrap; }
  .tin { position:relative; width:118px; height:64px; touch-action:none; }
  .tin.small { width:70px; height:44px; }
  .tinBody { position:absolute; left:0; right:0; top:14px; bottom:0; border-radius:8px 8px 26px 26px/4px 4px 22px 22px;
             background:linear-gradient(#c8ccd4,#8f959f); box-shadow:0 5px 10px rgba(0,0,0,.3); }
  .tinMouth { position:absolute; left:2px; right:2px; top:2px; height:26px; border-radius:50%;
              background:#6f757f; box-shadow:0 0 0 4px #d6dae1; overflow:hidden; }
  .tin.small .tinMouth { height:18px; box-shadow:0 0 0 3px #d6dae1; }
  .tinBatter { position:absolute; left:6%; right:6%; top:16%; bottom:8%; border-radius:50%;
               background:#f6e3bb; display:none; }
  .tinBrown { position:absolute; inset:0; border-radius:inherit; opacity:0; pointer-events:none; }
  .bgold { background:radial-gradient(circle, rgba(205,140,50,.18) 30%, rgba(185,112,32,.82) 86%); }
  .bchar { background:radial-gradient(circle, rgba(50,28,12,.5) 30%, rgba(28,15,6,.9) 86%); }

  #standSpot { width:326px; height:250px; position:relative; }
  #stand { position:absolute; left:50%; bottom:0; z-index:2; transform:translateX(-50%); width:250px; height:64px; display:none; }
  #standTop { position:absolute; left:0; right:0; top:0; height:26px; border-radius:50%;
              background:linear-gradient(#fff,#e6e6ee); box-shadow:0 5px 10px rgba(0,0,0,.22); }
  #standStem { position:absolute; left:50%; top:20px; width:34px; height:34px; transform:translateX(-50%);
               background:linear-gradient(90deg,#dcdce6,#fff,#c9c9d6); }
  #standFoot { position:absolute; left:50%; bottom:0; width:120px; height:20px; transform:translateX(-50%);
               border-radius:50%; background:linear-gradient(#f2f2f8,#cfcfdc); }
  #cake { position:absolute; left:50%; bottom:44px; z-index:3; transform:translateX(-50%); width:206px; display:none; }
  #cakeBody { position:relative; width:206px; }
  .lyr { height:26px; position:relative; }
  .lyrCream { height:9px; background:linear-gradient(#fffdf6,#f0e6d2); }
  #cakeTop { position:absolute; left:0; right:0; top:-19px; height:38px; border-radius:50%;
             background:radial-gradient(circle at 45% 35%, #fff9ef, #f3e3c4); box-shadow:0 -2px 0 rgba(255,255,255,.6) inset; z-index:3; }
  #cakeBase { position:absolute; left:0; right:0; bottom:-16px; height:32px; border-radius:50%; z-index:0; }
  #tops { position:absolute; left:0; right:0; top:-19px; height:38px; z-index:6; }
  #cands { position:absolute; left:0; right:0; top:-30px; height:50px; z-index:8; }
  .piece { position:absolute; cursor:pointer; animation:plop .3s ease-out; }
  @keyframes plop { from{transform:scale(2.2); opacity:0} to{transform:scale(1); opacity:1} }
  .cand { position:absolute; width:12px; cursor:pointer; }
  .candStick { position:absolute; left:0; bottom:0; width:12px; height:40px; border-radius:3px; }
  .candWick { position:absolute; left:5px; bottom:40px; width:2px; height:6px; background:#4a3a2a; }
  .candFlame { position:absolute; left:2px; bottom:45px; width:9px; height:15px; border-radius:50% 50% 45% 45%/62% 62% 38% 38%;
               background:radial-gradient(closest-side at 50% 85%, #fff8c0,#ffd24d 40%,#ff8a1e 78%,transparent);
               animation:flick .32s ease-in-out infinite alternate; display:none;
               box-shadow:0 0 12px rgba(255,180,60,.9); }
  .cand.lit .candFlame { display:block; }
  @keyframes puff { to { transform:translateY(-30px) scale(2.4); opacity:0; } }

  /* ---------- rack ---------- */
  #rack { background:linear-gradient(#fff4fa,#ffd9ea); border-top:5px solid #e79ac0; padding:6px 12px 8px;
          display:none; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; }
  .rbtn { font-family:inherit; font-size:17px; padding:9px 17px; border-radius:16px; border:4px solid #fff; color:#fff;
          cursor:pointer; display:none; }
  .rbtn:hover { transform:scale(1.06); }
  #lightBtn { background:#ff8a1e; }
  #blowBtn { background:#4aa8dd; }
  #finishBtn { background:#1f9d3c; }

  /* ---------- misc ---------- */
  #ghost { position:fixed; z-index:800; pointer-events:none; display:none;
           transform:translate(-50%,-50%) scale(1.25); filter:drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  #hintBubble { position:fixed; z-index:640; background:#fff; border:4px solid #ff6fae; border-radius:16px;
                padding:6px 12px; font-size:15px; color:#a8286a; transform:translate(-50%,-100%);
                pointer-events:none; display:none; max-width:290px; text-align:center;
                animation:bub .95s ease-in-out infinite alternate; }
  @keyframes bub { from{transform:translate(-50%,-100%)} to{transform:translate(-50%,calc(-100% - 9px))} }
  #hintBubble::after { content:""; position:absolute; left:50%; bottom:-13px; transform:translateX(-50%);
                       border:9px solid transparent; border-top-color:#ff6fae; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:950; display:none; overflow:hidden; }
  .conf { position:absolute; top:-40px; font-size:26px; }
  @keyframes fall { to { transform:translateY(108vh) rotate(760deg); } }
  #finale { position:fixed; inset:0; z-index:960; background:rgba(255,214,235,.94); display:none;
            flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; }
  #finale h2 { font-size:38px; color:#a8286a; text-shadow:2px 2px 0 #fff; }
  #finCake { width:230px; height:180px; position:relative; }
  #finTxt { font-size:19px; color:#8a4a12; max-width:640px; }
  #finSteps { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:700px; }
  .fs { background:#fff; border:3px solid #ffb0d4; border-radius:12px; padding:3px 8px; font-size:12px; color:#a8286a; }
  #againBtn,#otherBtn { font-family:inherit; font-size:19px; padding:11px 22px; border-radius:18px; border:4px solid #fff;
              background:#ff6fae; color:#fff; cursor:pointer; }
  #finBtns { display:flex; gap:10px; }
  #otherBtn { background:#7a4ad0; }
</style>
</head>
<body>

<h1>🎂 Emma's Cake Bakery</h1>
<div id="sub">Follow the recipe — mix, bake and decorate!</div>

<button id="backBtn">🍰 Choose another cake</button>
<div id="diffbar">
  <button class="diff on" data-d="easy">🐢 Easy</button>
  <button class="diff" data-d="med">🧁 Baker</button>
  <button class="diff" data-d="hard">👩‍🍳 Super Chef</button>
</div>

<!-- ============ CAKE PICKER ============ -->
<div id="picker">
  <h2>Which cake shall we bake? 🎂</h2>
  <div id="pickRow"></div>
</div>

<!-- ============ GAME ============ -->
<div id="wrap">
  <div id="recipe">
    <h3>📜 My Recipe</h3>
    <div id="ingList"></div>
    <div id="steps"></div>
  </div>

  <div id="scene">
    <div id="stageIn">

      <!-- prep -->
      <div class="station" id="prepSt">
        <div id="shelf"></div>
        <div id="bowlSpot">
          <div id="bowl">
            <div id="stirbar"><div id="stirfill"></div></div>
            <div id="bowlBody"></div>
            <div id="bowlMouth">
              <div id="bowlContent">
                <div id="bowlBits"></div>
                <div id="swirl"></div>
              </div>
            </div>
          </div>
          <div id="mixer"></div>
        </div>
        <div class="bench"></div>
      </div>

      <!-- range: hob + oven -->
      <div class="station" id="rangeSt">
        <div id="range">

/* ---------------- cake drawing ---------------- */
const LAYERS = {
  golden:  { top:"#f5e6c2", bands:[[100,"#eecf8f"]] },
  choco:   { top:"#3f2110", bands:[[100,"#4a2a15"]] },
  rainbow: { top:"#fffaf2", bands:[[26,"#ff6b7d"],[7,"#fffdf6"],[26,"#ffd95e"],[7,"#fffdf6"],[26,"#6fdc92"],[7,"#fffdf6"],[26,"#7bbcf2"]] },
  tira:    { top:"#8a5a34", bands:[[15,"#e2c179"],[30,"#fdf6e4"],[15,"#e2c179"],[30,"#fdf6e4"],[12,"#a06a3c"]] },
};
const CAKE_W = 206;                       // the on-stage cake; cakeArt scales off it
function bandCss(h,c){ return `<div class="lyr" style="height:${h}px;background:linear-gradient(90deg,${shade(c,-16)},${c} 30%,${shade(c,12)} 62%,${shade(c,-22)})"></div>`; }
function cakeArt(key, w){
  const L=LAYERS[key], k=w/CAKE_W;
  const bodyH=L.bands.reduce((a,b)=>a+b[0],0)*k, topH=w*.185, baseH=w*.155;
  const body=L.bands.map(([h,c])=>bandCss(h*k,c)).join("");
  return `<div style="position:relative;width:${w}px;height:${(topH/2+bodyH+baseH/2).toFixed(1)}px">
    <div style="position:absolute;left:1%;right:1%;bottom:0;height:${baseH}px;border-radius:50%;background:${shade(L.bands.at(-1)[1],-26)}"></div>
    <div style="position:absolute;left:0;right:0;top:${topH/2}px;height:${bodyH}px;overflow:hidden">${body}</div>
    <div style="position:absolute;left:0;right:0;top:0;height:${topH}px;border-radius:50%;
         background:radial-gradient(circle at 44% 34%, ${shade(L.top,14)}, ${L.top});
         box-shadow:0 -2px 0 rgba(255,255,255,.5) inset"></div>
  </div>`;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  const c=v=>Math.max(0,Math.min(255,v));
  return "#"+((1<<24)+(c(r)<<16)+(c(g)<<8)+c(b)).toString(16).slice(1);
}

/* ---------------- sound + voice ---------------- */
let actx=null;
function AC(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); return actx; }catch(e){ return null; } }
function tone(f, t0off, dur, type="sine", vol=.35){
  const a=AC(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(a.destination);
  const t0=a.currentTime+t0off;
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.start(t0); o.stop(t0+dur+.05);
}
const ding   = ()=>{ tone(1318.5,0,.9); tone(1568,.18,.9); };
const plop   = ()=>{ tone(320+ir(90),0,.16,"triangle",.28); };
const pourSfx= ()=>{ tone(180,0,.5,"sawtooth",.10); tone(240,.1,.4,"sawtooth",.08); };
const whirr  = ()=>{ tone(90,0,.25,"square",.06); };
const chime  = ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.5)); };
const puffSfx= ()=>{ tone(600,0,.22,"triangle",.14); tone(300,.05,.3,"sine",.10); };
function fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.75,"sine",.32)); }
function say(t){ try{ const u=new SpeechSynthesisUtterance(t); u.rate=.95; u.pitch=1.3;
  speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

    case "add":
      need={}; Object.assign(need, s.ings);

    case "stir":
      stirRad=0; lastAng=null; $("stirfill").style.width="0";

    case "blend":
      blendT=0; mixer.style.display="block"; $("stirfill").style.width="0";
      $("stirbar").style.display="block"; break;
    case "heat": break;
    case "pourInto": break;
    case "pourTin": poured=0; break;
    case "colour":
      need={colR:1,colY:1,colG:1,colB:1}; showShelf(["colR","colY","colG","colB"]); break;

document.addEventListener("pointerdown", e=>{

  const card=e.target.closest(".card");
  if(card){
    e.preventDefault();
    if(card.classList.contains("used")||card.classList.contains("dim")){ nope(card); return; }
    const kind=card.dataset.kind||"ing";
    if(kind==="ing" && !["add","colour","dip"].includes(s.t)){ nope(card); return; }
    if((kind==="top"||kind==="cand") && s.t!=="decorate"){ nope(card); return; }
    drag={type:kind, id:card.dataset.id, card};
    ghost.innerHTML = `<div style="width:70px;height:70px;position:relative">${
      kind==="ing"?ING[card.dataset.id].art : (kind==="top"?TOP[card.dataset.id].thumb : candArt(card.dataset.id,1))}</div>`;
    moveGhost(e.clientX,e.clientY); ghost.style.display="block";
    return;
  }
  if(e.target.closest("#mixer") && s.t==="blend"){
    e.preventDefault(); drag={type:"blend"}; startBlend(); return;
  }
  if(e.target.closest("#bowl")){
    if(s.t==="stir"){ e.preventDefault(); drag={type:"stir"}; lastAng=null;
      whisk.style.display="block"; moveWhisk(e.clientX,e.clientY); return; }
    if(s.t==="pourTin"){ e.preventDefault(); grabBowl(e); return; }
    return;
  }
  if(e.target.closest("#pan") && s.t==="pourInto"){ e.preventDefault(); grabPan(e); return; }
  if(e.target.closest("#knob") && s.t==="heat"){ e.preventDefault(); lightStove(); return; }
  const tinEl=e.target.closest(".tin");
  if(tinEl && (s.t==="bake"||s.t==="chill")){ e.preventDefault(); grabTin(e,tinEl); return; }
  const lyr=e.target.closest(".layerDisc");
  if(lyr && s.t==="stack"){ e.preventDefault(); grabLayer(e,lyr); return; }
  if(e.target.closest("#oven") && s.t==="bake" && bakeReady){ e.preventDefault(); takeOut(); return; }
  if(e.target.closest("#fridge") && s.t==="chill" && chillReady){ e.preventDefault(); takeOutFridge(); return; }
});
document.addEventListener("pointermove", e=>{

  else if(t==="stir") doStir(e.clientX,e.clientY);

function hit(x,y,sel){ if(x<0) return null; const el=document.elementFromPoint(x,y); return el?el.closest(sel):null; }

/* ---- ghost lifting (avoids position:fixed inside the transformed stage) ---- */
function ghostSet(scale, rot=0){ ghost.style.transform=`translate(-50%,-50%) scale(${scale}) rotate(${rot}deg)`; }
function liftGhost(el, e, rot=0){
  const c=el.cloneNode(true);
  c.style.position="relative"; c.style.left="0"; c.style.top="0"; c.style.right="auto"; c.style.bottom="auto";
  c.style.width=px(el.offsetWidth); c.style.height=px(el.offsetHeight); c.style.margin="0";
  ghost.innerHTML=""; ghost.appendChild(c);
  ghostSet(SCALE(), rot); ghost.style.display="block";
  moveGhost(e.clientX,e.clientY);
  el.style.visibility="hidden";
}
function dropGhost(el){ ghost.style.display="none"; ghostSet(1.25,0); if(el) el.style.visibility=""; }

/* =========================================================
   STEP: add
   ========================================================= */
function dropIng(d,x,y){
  const s=step();
  if(s.t==="dip"){ return dropBiscuit(d,x,y); }
  if(s.t==="colour"){ return dropColour(d,x,y); }
  const target = s.to==="pan" ? hit(x,y,"#pan") : hit(x,y,"#bowl");
  if(!target){ showHint(); return; }
  if(!need[d.id] || need[d.id]<=0){ nope(d.card); return; }
  need[d.id]--; refreshShelfCounts();
  const it=ING[d.id];
  const wanted = s.ings[d.id], done = wanted - need[d.id];
  plop(); say(wanted>1 ? (COUNT[done-1]||it.say) : it.say);
  if(s.to==="pan"){
    panContent.style.display="block"; panHas=true;
    panContent.style.background = d.id==="coffee" ? "#3a2010" : shade(it.tint,-10);
  } else {
    showBowl(); addBits(d.id); mixColour(it.tint, .38);
  }
  markIng(d.id);
  if(Object.values(need).every(v=>v<=0)) setTimeout(nextStep, 520);
  else showHint();
}

/* =========================================================
   STEP: stir  /  blend
   ========================================================= */
function doStir(x,y){
  moveWhisk(x,y);
  const r=bowl.getBoundingClientRect();
  const ang=Math.atan2(y-(r.top+r.height*.32), x-(r.left+r.width/2));
  if(lastAng!==null){ let da=Math.abs(ang-lastAng); if(da>Math.PI) da=2*Math.PI-da; if(da<1) stirRad+=da; }
  lastAng=ang;
  const p=Math.min(1, stirRad/(diff.turns*2*Math.PI));
  $("stirfill").style.width=(p*100)+"%";
  const sw=$("swirl"); sw.style.display="block";
  if(!sw.dataset.built){ sw.dataset.built="1";
    sw.innerHTML=[0,1,2,3].map(i=>`<div class="streak" style="transform:rotate(${i*90}deg)"></div>`).join(""); }
  sw.style.transform=`rotate(${(stirRad*57.3)}deg)`;
  if(Math.random()<.06) tone(150+ir(60),0,.09,"triangle",.05);
  if(p>=1) finishMix();
}
function startBlend(){
  whirr(); mixer.style.transform="translateX(-50%) translateY(46px)";
  $("swirl").style.display="block";
  if(!$("swirl").dataset.built){ $("swirl").dataset.built="1";
    $("swirl").innerHTML=[0,1,2,3].map(i=>`<div class="streak" style="transform:rotate(${i*90}deg)"></div>`).join(""); }
  const t0=performance.now()-blendT*1000;
  const loop=()=>{
    blendT=(performance.now()-t0)/1000;
    const p=Math.min(1, blendT/diff.blend);
    $("stirfill").style.width=(p*100)+"%";
    $("swirl").style.transform=`rotate(${blendT*900}deg)`;
    if(Math.random()<.25) whirr();
    if(p>=1){ stopBlend(); finishMix(); return; }
    blendRaf=requestAnimationFrame(loop);
  };
  blendRaf=requestAnimationFrame(loop);
}
function stopBlend(){ cancelAnimationFrame(blendRaf); mixer.style.transform="translateX(-50%)"; }
function finishMix(){
  if(step().t!=="stir" && step().t!=="blend") return;
  cancelAnimationFrame(blendRaf);
  $("stirbar").style.display="none"; $("swirl").style.display="none";
  mixer.style.display="none"; whisk.style.display="none";
  bowlBits.innerHTML="";                       // everything is blended in
  bowlContent.style.background=`radial-gradient(circle at 45% 38%, ${shade(batterCol,14)}, ${batterCol})`;
  chime(); say("Perfect! All smooth!");
  nextStep();
}

/* =========================================================
   STEP: heat (stove)
   ========================================================= */
function lightStove(){
  if(range.classList.contains("hot")) return;
  range.classList.add("hot"); tone(120,0,.6,"sawtooth",.10);
  if(!$("burner").dataset.f){ $("burner").dataset.f="1";
    for(let i=0;i<10;i++){ const f=document.createElement("div"); f.className="sflame";
      const a=i/10*Math.PI*2; f.style.left=px(52+Math.cos(a)*44); f.style.top=px(28+Math.sin(a)*28);
      f.style.animationDelay=(i*.07)+"s"; $("burner").appendChild(f); } }
  say("The fire is on! Watch it melt!");
  for(let i=0;i<4;i++){ const st=document.createElement("div"); st.className="steam";
    st.style.left=px(34+i*22); st.style.top="18px"; st.style.animationDelay=(i*.5)+"s"; pan.appendChild(st); }
  let t=0; const secs=diff.heat;
  const iv=setInterval(()=>{
    t+=.1;
    const p=Math.min(1,t/secs);
    panContent.style.borderRadius="50%";
    panContent.style.filter=`brightness(${1+p*.25})`;
    if(p>=1){ clearInterval(iv); ding();
      say(R.id==="tiramisu"?"The coffee is warm!":"The chocolate is melted and shiny!");
      range.classList.remove("hot");
      pan.querySelectorAll(".steam").forEach(s=>s.remove());
      nextStep(); }
  },100);
}

/* =========================================================
   STEP: pourInto (pan -> bowl)
   ========================================================= */
function grabPan(e){ liftGhost(pan,e,-30); drag={type:"pan"}; }
function dropPan(x,y){
  dropGhost(pan);
  if(hit(x,y,"#bowl")){
    pourSfx(); showBowl();
    const col = panContent.style.background || "#5a3218";
    mixColour(col.startsWith("#")?col:"#5a3218", .85);
    panContent.style.display="none"; panHas=false;
    say("Splash! All in the bowl!");
    nextStep();
  } else showHint();
}

/* =========================================================
   STEP: pourTin (bowl -> tin)
   ========================================================= */
function grabBowl(e){ liftGhost(bowl,e,-30); drag={type:"bowl"}; }
function dropBowl(x,y){
  dropGhost(bowl);
  const t=hit(x,y,".tin");
  if(!t || t.filled){ showHint(); return; }
  t.filled=true; poured++;
  pourSfx();
  const b=tinBatter(t); b.style.display="block"; b.style.background=batterCol;
  b.animate([{transform:"scale(.2)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:420,easing:"ease-out"});
  const total=R.tins||1;
  if(poured>=total){
    if(R.id==="tiramisu"){ bowlContent.style.display="none"; bowlHas=false; }
    else if(total===1){ bowlContent.style.display="none"; bowlHas=false; }
    say(total>1?"All four tins are full!":"All in the tin!");
    nextStep();
  } else { say(COUNT[poured-1]||""); showHint(); }
}

/* =========================================================
   STEP: colour (rainbow)
   ========================================================= */
function dropColour(d,x,y){
  const t=hit(x,y,".tin");
  if(!t){ showHint(); return; }
  if(t.coloured){ say("That one already has a colour!"); return; }
  if(!need[d.id]||need[d.id]<=0){ nope(d.card); return; }
  need[d.id]--; refreshShelfCounts();
  t.coloured=ING[d.id].colour;
  const b=tinBatter(t); b.style.transition="background .6s"; b.style.background=ING[d.id].colour;
  markIng(d.id); plop(); say(ING[d.id].say);
  if(Object.values(need).every(v=>v<=0)) setTimeout(nextStep,520); else showHint();
}

/* =========================================================
   STEP: dip (tiramisu)
   ========================================================= */
function dropBiscuit(d,x,y){
  if(!hit(x,y,"#pan")){ showHint(); return; }
  need.biscuit--; dipped++; refreshShelfCounts();
  tone(420,0,.12,"triangle",.2);
  const t=tins[0], pr=pan.getBoundingClientRect(), tr=t.getBoundingClientRect();
  const fly=document.createElement("div");
  fly.innerHTML=`<div style="width:54px;height:54px;position:relative">${biscuitArt()}</div>`;
  Object.assign(fly.style,{position:"fixed",zIndex:820,left:px(pr.left+pr.width/2),top:px(pr.top+pr.height/2),
    transform:"translate(-50%,-50%)",pointerEvents:"none",filter:"brightness(.72) sepia(.5)"});
  document.body.appendChild(fly);
  fly.animate([{transform:"translate(-50%,-50%) scale(1)"},
    {transform:`translate(${tr.left+tr.width/2-(pr.left+pr.width/2)-27}px, ${tr.top+tr.height/2-(pr.top+pr.height/2)-27}px) scale(.6)`}],
    {duration:520,easing:"ease-in-out"}).onfinish=()=>{ fly.remove(); addBiscuitToDish(); };
  say(COUNT[dipped-1]||"");
  if(need.biscuit<=0){ markIng("biscuit"); setTimeout(nextStep,900); } else showHint();
}
function addBiscuitToDish(){
  const t=tins[0], m=t.querySelector(".tinMouth");
  const b=document.createElement("div");
  Object.assign(b.style,{position:"absolute",left:(8+((dipped-1)%3)*30)+"%",top:(26+Math.floor((dipped-1)/3)*30)+"%",
    width:"26%",height:"26%",borderRadius:"8px",background:"linear-gradient(#c9a05c,#a87c3c)",zIndex:2,
    animation:"plop .3s ease-out"});
  m.appendChild(b); plop();
}

/* =========================================================
   STEP: bake  (oven)  /  chill  (fridge)
   ========================================================= */
let bakeReady=false, chillReady=false, tinsIn=false;
function grabTin(e, el){ liftGhost(el,e,0); drag={type:"tin", el}; }
function dropTin(d,x,y){
  dropGhost(d.el);
  const s=step();
  if(s.t==="bake" && hit(x,y,"#oven")) return putInOven();
  if(s.t==="chill" && hit(x,y,"#fridge")) return putInFridge();
  showHint();
}
function paintBar(z){
  const w=z.burn*1.12;
  const g=`linear-gradient(90deg, #f7e1b5 0 ${z.ps/w*100}%, #8ede8a ${z.ps/w*100}% ${z.pe/w*100}%,
           #e8a53a ${z.pe/w*100}% ${z.burn/w*100}%, #4a3020 ${z.burn/w*100}% 100%)`;
  $("cookbar").style.background=g;
  const old=$("cookbar").querySelector("#barstar"); if(old) old.remove();
  const st=document.createElement("div"); st.id="barstar"; st.textContent="⭐";
  st.style.left=((z.ps+z.pe)/2/w*100)+"%"; $("cookbar").appendChild(st);
  return w;
}
function putInOven(){
  tinsIn=true; bubble.style.display="none";
  ovenDoor.classList.add("open"); tone(160,0,.35,"sawtooth",.12);
  setTimeout(()=>{
    tins.forEach(t=>t.style.visibility="hidden");
    ovenTin.style.display="block";
    ovenTin.innerHTML=`<div style="display:flex;gap:4px">${tins.map(t=>
      `<div style="width:${(R.tins?26:70)}px;height:14px;border-radius:3px 3px 8px 8px;
        background:${t.coloured||batterCol};box-shadow:0 0 0 3px #8f959f"></div>`).join("")}</div>`;
    ovenDoor.classList.remove("open");
    ovenGlow.style.opacity="1";
    $("display").textContent=R.temp+" °C";
    say("Baking! Watch the bar — take it out when it goes ding!");
    startBake();
  },460);
}
function startBake(){
  const z=diff.bake, w=paintBar(z);
  $("barwrap").style.display="block";
  bakeElapsed=0; dinged=false; bakeReady=false;
  const t0=performance.now();
  const loop=()=>{
    bakeElapsed=(performance.now()-t0)/1000;
    $("needle").style.left=Math.min(100, bakeElapsed/w*100)+"%";
    const gp=Math.min(1, bakeElapsed/z.pe), cp=Math.max(0,Math.min(1,(bakeElapsed-z.pe)/(z.burn-z.pe)));
    ovenGlow.style.opacity=String(.75+.25*Math.sin(bakeElapsed*3));
    ovenTin.dataset.g=gp; ovenTin.dataset.c=cp;
    if(!dinged && bakeElapsed>=z.ps){ dinged=true; bakeReady=true; ding();
      sign.textContent="⭐ DING! TAKE IT OUT! ⭐"; sign.className="alarm"; sign.style.display="block";
      say("Ding! Take the cake out!"); hintAt(oven,"Click the oven! ⭐"); }
    if(bakeElapsed>=z.burn+4){ takeOut(); return; }
    bakeRaf=requestAnimationFrame(loop);
  };
  bakeReady=true;                                  // she may always open the oven
  bakeRaf=requestAnimationFrame(loop);
}
function takeOut(){
  cancelAnimationFrame(bakeRaf);
  const z=diff.bake;
  bakeVerdict = bakeElapsed<z.ps ? "pale" : (bakeElapsed<=z.pe ? "perfect" : "burnt");
  sign.style.display="none"; bubble.style.display="none";
  $("barwrap").style.display="none"; ovenGlow.style.opacity="0"; $("display").textContent="--- °C";
  ovenDoor.classList.add("open"); ovenTin.style.display="none";
  setTimeout(()=>{ ovenDoor.classList.remove("open"); },700);
  tins.forEach(t=>{ t.style.visibility="";
    const b=tinBatter(t);
    b.querySelector(".bgold").style.opacity = bakeVerdict==="pale"?.25:(bakeVerdict==="perfect"?.62:.75);
    b.querySelector(".bchar").style.opacity = bakeVerdict==="burnt"?.55:0;
    t.animate([{transform:"scale(.5)",opacity:.4},{transform:"scale(1)",opacity:1}],{duration:450,easing:"ease-out"});
  });
  const M={ pale:["⭐⭐","It is a little pale — but still yummy!"],
            perfect:["⭐⭐⭐","PERFECT! A beautiful golden cake!"],
            burnt:["⭐","Ooh, a bit crispy — the frosting will hide it!"] };
  chime(); say(M[bakeVerdict][1]);
  afterCook();
}
function putInFridge(){
  bubble.style.display="none";
  tins.forEach(t=>t.style.visibility="hidden");
  frGlow.style.opacity="1"; fridge.classList.add("open");
  for(let i=0;i<6;i++){ const s=document.createElement("div"); s.className="snowf"; s.textContent="❄️";
    s.style.left=px(10+ir(70)); s.style.top="76px"; s.style.animationDelay=(i*.45)+"s"; fridge.appendChild(s); }
  $("chillbar").style.display="block";
  say("Brrr! Chilling in the fridge!");
  let t=0; const secs=diff.chill;
  const iv=setInterval(()=>{
    t+=.1; $("chillfill").style.width=Math.min(100,t/secs*100)+"%";
    if(t>=secs){ clearInterval(iv); chillReady=true; ding();
      sign.textContent="❄️ IT'S READY! ❄️"; sign.className="alarm"; sign.style.display="block";
      say("Ding! The tiramisu is cold and ready!"); hintAt(fridge,"Click the fridge! ❄️"); }
  },100);
}
function takeOutFridge(){
  sign.style.display="none"; bubble.style.display="none";
  frGlow.style.opacity="0"; $("chillbar").style.display="none";
  fridge.querySelectorAll(".snowf").forEach(s=>s.remove());
  tins.forEach(t=>t.style.visibility="");
  bakeVerdict="perfect"; chime(); say("Perfect! Cold and creamy!");
  afterCook();
}
function afterCook(){
  const nxt=R.steps[si+1];
  if(nxt && nxt.t==="stack"){ setTimeout(nextStep, 900); }
  else setTimeout(()=>{ buildCake(); nextStep(); }, 1000);
}

/* =========================================================
   the cake on the stand
   ========================================================= */
let topCol="#f5e6c2";
function renderCake(){
  cakeBody.innerHTML = cakeLayers.map(([h,c])=>bandCss(h,c)).join("");
  cakeTop.style.background=`radial-gradient(circle at 44% 34%, ${shade(topCol,14)}, ${topCol})`;
  cakeBase.style.background=shade(cakeLayers.length?cakeLayers.at(-1)[1]:"#ccc",-26);
}
function buildCake(){
  const L=LAYERS[R.stand];
  cakeLayers=L.bands.map(b=>b.slice()); topCol=L.top;
  if(bakeVerdict==="burnt") cakeLayers=cakeLayers.map(([h,c])=>[h,shade(c,-34)]);
  if(bakeVerdict==="pale")  cakeLayers=cakeLayers.map(([h,c])=>[h,shade(c,16)]);
  renderCake();
  stand.style.display="block"; cake.style.display="block";
  const from=tins[0].getBoundingClientRect(), to=cake.getBoundingClientRect();
  cake.animate([{transform:`translateX(-50%) translate(${from.left-to.left}px, ${from.top-to.top}px) scale(.55)`,opacity:.5},
                {transform:"translateX(-50%)",opacity:1}],{duration:800,easing:"ease-out"});
  tins.forEach(t=>t.style.display="none");
  tone(660,0,.4); tone(880,.14,.5);
}
function makeLayerDiscs(){
  const cols=tins.map(t=>t.coloured||batterCol);
  tinArea.innerHTML=""; tins=[]; shelf.innerHTML="";
  stand.style.display="block";
  cols.forEach(c=>{
    const d=document.createElement("div"); d.className="layerDisc"; d.dataset.c=c;
    d.style.cssText="position:relative;width:74px;height:34px;touch-action:none";
    d.innerHTML=`<div style="position:absolute;left:0;right:0;top:7px;height:22px;
        background:linear-gradient(90deg,${shade(c,-16)},${c} 40%,${shade(c,12)})"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:12px;border-radius:50%;background:${shade(c,-24)}"></div>
      <div style="position:absolute;left:0;right:0;top:0;height:14px;border-radius:50%;background:${shade(c,10)}"></div>`;
    shelf.appendChild(d);
  });
  cakeLayers=[]; topCol=LAYERS.rainbow.top;
}
function grabLayer(e,el){ liftGhost(el,e,0); drag={type:"layer", el, c:el.dataset.c}; }
function dropLayer(d,x,y){
  dropGhost(d.el);
  if(!hit(x,y,"#standSpot")){ showHint(); return; }
  if(cakeLayers.length) cakeLayers.unshift([7,"#fffdf6"]);
  cakeLayers.unshift([26, d.c]);
  d.el.remove();
  cake.style.display="block"; renderCake();
  tone(520+cakeLayers.length*60,0,.3); plop();
  say(cakeLayers.length>1?"And a layer of cream!":"One layer!");
  if(!document.querySelector(".layerDisc")){ chime(); say("Four beautiful layers!"); nextStep(); }
  else showHint();
}

/* =========================================================
   STEP: decorate  (toppings + candles)
   ========================================================= */
const CANDLES={ c1:"#ff3d5e", c2:"#ffd23e", c3:"#3fc46b", c4:"#4a9ce8", c5:"#a45ee0", c6:"#ff6fae" };
function candArt(key, s=1){
  const c=CANDLES[key]||"#ff3d5e";
  return `<div style="position:relative;width:${12*s}px;height:${52*s}px">
    <div style="position:absolute;left:0;bottom:0;width:${12*s}px;height:${40*s}px;border-radius:3px;
      background:repeating-linear-gradient(135deg,${c} 0 ${5*s}px,#fff ${5*s}px ${10*s}px)"></div>
    <div style="position:absolute;left:${5*s}px;bottom:${40*s}px;width:2px;height:${6*s}px;background:#4a3a2a"></div>
    <div style="position:absolute;left:${2*s}px;bottom:${45*s}px;width:${9*s}px;height:${15*s}px;
      border-radius:50% 50% 45% 45%/62% 62% 38% 38%;
      background:radial-gradient(closest-side at 50% 85%,#fff8c0,#ffd24d 40%,#ff8a1e 78%,transparent)"></div>
  </div>`;
}
function startDecorate(){
  rack.style.display="flex"; rack.innerHTML="";
  const tKeys = R.id==="tiramisu" ? ["cocoaT","cream","chips","straw","hearts","stars","smart","sprk","drizz"]
                                  : ["cream","straw","cherry","chips","smart","sprk","hearts","stars","banana","drizz"];
  tKeys.forEach(id=>{
    const it=TOP[id]; const c=document.createElement("div");
    c.className="card"; c.dataset.kind="top"; c.dataset.id=id;
    c.innerHTML=`<div class="thumb">${it.thumb}</div><div class="lbl">${it.lbl}</div>`;
    rack.appendChild(c);
  });
  const sep=document.createElement("div"); sep.style.cssText="width:4px;height:70px;background:#e79ac0;border-radius:3px";
  rack.appendChild(sep);
  Object.keys(CANDLES).forEach(k=>{
    const c=document.createElement("div"); c.className="card"; c.dataset.kind="cand"; c.dataset.id=k;
    c.style.width="46px";
    c.innerHTML=`<div class="thumb" style="width:26px;display:flex;align-items:flex-end;justify-content:center">${candArt(k,.8)}</div>`;
    rack.appendChild(c);
  });
  ["lightBtn","blowBtn","finishBtn"].forEach(id=>{
    const b=document.createElement("button"); b.id=id; b.className="rbtn"; rack.appendChild(b);
  });
  $("lightBtn").textContent="🔥 Light the candles!";
  $("blowBtn").textContent="😮‍💨 Blow them out!";
  $("finishBtn").textContent="🎉 It's finished!";
  $("finishBtn").style.display="inline-block";
  $("lightBtn").addEventListener("click", lightCandles);
  $("blowBtn").addEventListener("click", ()=>{ cands.querySelectorAll(".cand.lit").forEach(blowOne); });
  $("finishBtn").addEventListener("click", finish);
  fitStage();
}
function localOnTop(x,y){
  const r=cakeTop.getBoundingClientRect(), s=SCALE();
  let lx=(x-r.left)/s, ly=(y-r.top)/s;
  const cx=103, cy=19, a=92, b=14;
  const d=Math.hypot((lx-cx)/a,(ly-cy)/b);
  if(d>1){ lx=cx+(lx-cx)/d; ly=cy+(ly-cy)/d; }
  return [lx,ly];
}
function dropTop(d,x,y){
  if(!hit(x,y,"#cake")){ hintAt(cakeTop,"Drop it on the cake! 🎂"); return; }
  const it=TOP[d.id];
  if(it.dust){
    for(let i=0;i<70;i++){
      const a=Math.random()*Math.PI*2, rad=Math.sqrt(Math.random());
      const s=document.createElement("div");
      Object.assign(s.style,{position:"absolute",left:(103+Math.cos(a)*rad*90)+"px",top:(19+Math.sin(a)*rad*13)+"px",
        width:"4px",height:"4px",borderRadius:"50%",background:it.dust,opacity:.55+Math.random()*.4,pointerEvents:"none"});
      tops.appendChild(s);
    }
    say("Cocoa dust! Snow on your tiramisu!");
  } else if(it.drizzle){
    for(let i=0;i<7;i++){
      const l=document.createElement("div");
      Object.assign(l.style,{position:"absolute",left:(14+i*26)+"px",top:(4+ir(6))+"px",width:"5px",
        height:(20+ir(12))+"px",borderRadius:"4px",background:"linear-gradient(#5a3218,#3a1e0c)",
        transform:`rotate(${ir(16)-8}deg)`,pointerEvents:"none"});
      tops.appendChild(l);
    }
    say("Chocolate drizzle!");
  } else {
    const [lx,ly]=localOnTop(x,y);
    for(let i=0;i<it.n;i++){
      const a=Math.random()*Math.PI*2, rad=Math.sqrt(Math.random())*34;
      const p=document.createElement("div"); p.className="piece";
      p.innerHTML=it.piece();
      let px_=lx+Math.cos(a)*rad, py_=ly+Math.sin(a)*rad*.32;
      const dd=Math.hypot((px_-103)/92,(py_-19)/14); if(dd>1){ px_=103+(px_-103)/dd; py_=19+(py_-19)/dd; }
      p.style.left=(px_-it.w/2)+"px"; p.style.top=(py_-it.w/2)+"px";
      p.style.zIndex=String(Math.round(py_));
      p.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); });
      p.addEventListener("click", ev=>{ ev.stopPropagation(); p.remove(); tone(300,0,.1,"triangle",.12); });
      tops.appendChild(p);
    }
    say(it.lbl+"!");
  }
  plop();
}
function dropCand(d,x,y){
  if(!hit(x,y,"#cake")){ hintAt(cakeTop,"Put the candles on top! 🕯️"); return; }
  const [lx,ly]=localOnTop(x,y);
  const c=document.createElement("div"); c.className="cand";
  c.style.left=(lx-6)+"px"; c.style.bottom=(50-(ly+11))+"px"; c.style.zIndex=String(Math.round(ly)+10);
  const col=CANDLES[d.id];
  c.innerHTML=`<div class="candStick" style="background:repeating-linear-gradient(135deg,${col} 0 5px,#fff 5px 10px)"></div>
               <div class="candWick"></div><div class="candFlame"></div>`;
  c.addEventListener("pointerdown", ev=>ev.stopPropagation());
  c.addEventListener("click", ev=>{ ev.stopPropagation();
    if(c.classList.contains("lit")) blowOne(c); else { c.remove(); candles=candles.filter(k=>k!==c); tone(280,0,.1,"triangle",.12); } });
  cands.appendChild(c); candles.push(c);
  c.animate([{transform:"translateY(-40px)",opacity:0},{transform:"none",opacity:1}],{duration:340,easing:"ease-out"});
  tone(700+candles.length*40,0,.18,"triangle",.2);
  $("lightBtn").style.display="inline-block";
  if(candles.length===1) say("A candle! Add more, then light them!");
}
function lightCandles(){
  if(!candles.length) return;
  lit=true;
  candles.forEach((c,i)=>setTimeout(()=>{ c.classList.add("lit"); tone(900+i*50,0,.14,"triangle",.18); }, i*160));
  $("lightBtn").style.display="none";
  setTimeout(()=>{
    $("blowBtn").style.display="inline-block";
    say("Happy birthday to you! Happy birthday to you! Now make a wish and blow out the candles!");
    hintAt(cands,"Click the flames to blow them out! 😮‍💨");
  }, candles.length*160+400);
}
function blowOne(c){
  if(!c.classList.contains("lit")) return;
  c.classList.remove("lit"); puffSfx();
  const p=document.createElement("div");
  Object.assign(p.style,{position:"absolute",left:"-6px",bottom:"46px",width:"22px",height:"22px",
    borderRadius:"50%",background:"rgba(255,255,255,.7)",pointerEvents:"none",animation:"puff .8s ease-out forwards"});
  c.appendChild(p); setTimeout(()=>p.remove(),820);
  if(!cands.querySelector(".cand.lit")){
    bubble.style.display="none";
    celebrate(50); fanfare();
    say("Yaaay! You blew out all the candles! Make a wish, Emma!");
    $("blowBtn").style.display="none";
  }
}

/* =========================================================
   FINALE
   ========================================================= */
function finish(){
  rack.style.display="none"; bubble.style.display="none";
  const c=cake.cloneNode(true);
  c.style.cssText="position:absolute;left:50%;bottom:36px;transform:translateX(-50%);display:block";
  $("finCake").innerHTML=""; $("finCake").appendChild(c);
  const V={ perfect:"⭐⭐⭐ Perfectly baked!", pale:"⭐⭐ Nicely baked!", burnt:"⭐ Nice and crispy!" };
  $("finTitle").textContent = `🎉 ${R.emoji} ${R.name} — Bravo Emma! 🎉`;
  $("finTxt").innerHTML = (bakeVerdict? V[bakeVerdict]+"<br>":"") + "You made it all by yourself. Here is what you did:";
  $("finSteps").innerHTML = R.steps.map((s,i)=>`<div class="fs">${i+1}. ${s.lbl}</div>`).join("");
  $("finale").style.display="flex";
  celebrate(90); fanfare();
  say(`Congratulations chef Emma! Your ${R.name} is ready. Bon appétit!`);
}

/* =========================================================
   layout
   ========================================================= */
function fitStage(){
  const sc=$("scene"), st=$("stageIn");
  if(!st.offsetWidth) return;
  const s=Math.min(1.45, (sc.clientWidth-16)/st.offsetWidth, (sc.clientHeight-10)/st.offsetHeight);
  st.style.transform=`translateX(-50%) scale(${s.toFixed(3)})`;
  showHint();
}
window.addEventListener("resize", fitStage);
new ResizeObserver(fitStage).observe($("scene"));
</script>
